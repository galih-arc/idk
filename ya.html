<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>idk</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Outfit,sans-serif;height:100vh;overflow:hidden;background:#050816;color:#fff;display:flex;align-items:center;justify-content:center}
.bg,.bg:before,.bg:after{position:absolute;inset:-20%;content:"";background:
radial-gradient(circle at 20% 30%,#7c3aed66,transparent 20%),
radial-gradient(circle at 80% 70%,#06b6d466,transparent 20%),
radial-gradient(circle at 50% 50%,#ffffff11,transparent 35%);
filter:blur(30px);animation:f 12s ease-in-out infinite alternate}
.bg:before{animation-duration:18s;transform:rotate(30deg)}
.bg:after{animation-duration:22s;transform:rotate(-20deg)}
@keyframes f{to{transform:scale(1.2) translate(4%,2%)}}
.card{position:relative;z-index:2;width:min(900px,90%);padding:60px;border:1px solid #ffffff20;border-radius:32px;background:#ffffff10;backdrop-filter:blur(18px);box-shadow:0 20px 80px #0008}
h1{font-size:clamp(42px,8vw,82px);margin-bottom:18px}
#line{height:3px;width:120px;background:linear-gradient(90deg,#7c3aed,#06b6d4);border-radius:99px;margin:18px 0 28px}
p{font-size:clamp(18px,2.7vw,28px);line-height:1.7;color:#dbeafe}
.cursor{border-right:3px solid #fff;animation:b 1s steps(1) infinite}
@keyframes b{50%{border-color:transparent}}
.small{letter-spacing:4px;color:#9fb3ff;text-transform:uppercase}
</style></head><body><div class="bg"></div><div class="card"><div class="small"></div><h1>I'm Sorry.</h1><div id="line"></div><p><span id="t" class="cursor"></span></p></div>
<script>
const msg="Sorry because I became the reason for making your life restless.";
let i=0,t=document.getElementById('t');
(function type(){if(i<msg.length){t.textContent+=msg[i++];setTimeout(type,45)}else t.classList.remove('cursor')})();
</script></body></html>
