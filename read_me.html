<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>galih mode galau dlu dh</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#000;
color:#fff;
overflow-x:hidden;
}

/* Background Grid */

.bg{
position:fixed;
inset:0;
background:
linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
background-size:40px 40px;
mask-image:radial-gradient(circle,#fff 30%,transparent 95%);
z-index:-2;
}

.glow{
position:fixed;
width:600px;
height:600px;
background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);
left:50%;
top:50%;
transform:translate(-50%,-50%);
filter:blur(40px);
z-index:-1;
animation:pulse 5s ease-in-out infinite;
}

@keyframes pulse{
50%{
transform:translate(-50%,-50%) scale(1.25);
}
}

/* Hero */

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:30px;
}

small{
letter-spacing:8px;
font-size:12px;
color:#888;
display:block;
margin-bottom:25px;
text-transform:uppercase;
}

h1{
font-size:clamp(70px,12vw,170px);
font-weight:800;
letter-spacing:-6px;
line-height:.9;
}

.line{
width:120px;
height:2px;
background:#fff;
margin:35px auto;
opacity:.25;
}

p{
max-width:700px;
margin:auto;
font-size:22px;
line-height:1.9;
color:#bbb;
}

.scroll{
margin-top:80px;
font-size:13px;
letter-spacing:5px;
color:#777;
animation:updown 2s infinite;
}

@keyframes updown{
50%{
transform:translateY(12px);
}
}

/* Section */

section{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:60px;

}

.box{

max-width:800px;

}

.box h2{

font-size:70px;

margin-bottom:25px;

}

.box p{

font-size:22px;

line-height:2;

}

.fade{

opacity:0;

transform:translateY(60px);

transition:1.2s;

}

.fade.show{

opacity:1;

transform:translateY(0);

}

</style>

</head>

<body>

<div class="bg"></div>
<div class="glow"></div>

<div class="hero">

<div>

<small>A MESSAGE</small>

<h1>I'm<br>Sorry.</h1>

<div class="line"></div>

<p>
Sorry because I became the reason for making your life restless.
</p>

<div class="scroll">
SCROLL
</div>

</div>

</div>

<section>

<div class="box fade">

<h2>Thank You.</h2>

<p>

Thank you for every memory.
Every smile we shared will always remain a part of my life.

</p>

</div>

</section>

<section>

<div class="box fade">

<h2>Be Happy.</h2>

<p>

I sincerely hope your future is filled with happiness,
peace, and beautiful moments.

</p>

</div>

</section>

<script>

const observer=new IntersectionObserver(entries=>{

entries.forEach(entry=>{

if(entry.isIntersecting){

entry.target.classList.add("show");

}

});

});

document.querySelectorAll(".fade").forEach(el=>observer.observe(el));

</script>

</body>
</html>
